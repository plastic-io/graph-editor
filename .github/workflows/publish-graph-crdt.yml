name: Publish @plastic-io/graph-crdt

# On every push to main: build and test the shared package, then stage it on
# npm through trusted publishing (OIDC).  npmjs.com is configured to trust this
# workflow file by name, so the publish job has to live here — it cannot be a
# job in the site workflow.  A staged version goes live only after a maintainer
# approves it on npmjs.com (Staged Packages) with 2FA.
#
# The package is versioned in packages/GraphCrdt/package.json; a push whose
# version is already on npm stages nothing, so ordinary commits are quiet and
# a release is a version bump.
on:
  push:
    branches:
      - main
    paths:
      - 'packages/GraphCrdt/**'
      - '.github/workflows/publish-graph-crdt.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

defaults:
  run:
    working-directory: packages/GraphCrdt

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      # The package is a workspace of the editor, so its dependencies — and the
      # `prepare` that builds it — come from an install at the root.
      - name: Install
        run: npm ci
        working-directory: .
      - name: Build
        run: npm run build
      - name: What the package would ship
        run: npm pack --dry-run
      # The suites that cover this package live in the repository it is part of,
      # and they are what says the build is worth publishing.
      - name: Tests
        run: npm run test:crdt
        working-directory: .
      - name: Type check
        run: npm run type-check:ratchet
        working-directory: .

  publish:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          # no registry-url: setup-node would write an empty _authToken and
          # always-auth into .npmrc, and npm would use that instead of OIDC
      - name: Use an npm that knows staged publishing (11.15+)
        run: npm install -g npm@latest && npm --version
        working-directory: .
      - name: Install
        run: npm ci
        working-directory: .
      - name: Build
        run: npm run build
      - name: Skip when this version is already on npm
        id: check
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "already published: $NAME@$VERSION"; echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Show what trusted publishing will see
        run: |
          echo "repository: $GITHUB_REPOSITORY  workflow: $GITHUB_WORKFLOW_REF  ref: $GITHUB_REF"
          echo "OIDC token request url present: $([ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ] && echo yes || echo no)"
      - name: Stage on npm (awaits approval on npmjs.com)
        if: steps.check.outputs.publish == 'true'
        run: npm stage publish --access public
